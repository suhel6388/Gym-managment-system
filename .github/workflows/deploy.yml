name: Node.js CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Get latest source code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Deploy to AWS EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/Gym-managment-system
            git fetch origin main
            git reset --hard origin/main

            # Ensure swap space exists to prevent OOM kills on EC2
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
            fi

            # Clear all previous PM2 logs from memory and disk
            pm2 flush || true
            rm -rf ~/.pm2/logs/*

            npm install --no-audit --no-fund
            npx prisma generate || node node_modules/prisma/build/index.js generate
            pm2 delete all || true
            pm2 start ecosystem.config.cjs
            pm2 save

