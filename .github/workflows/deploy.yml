name: Node.js CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Get latest source code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Deploy to AWS EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/Gym-managment-system
            git fetch origin main
            git reset --hard origin/main

            # 1. Expand partition if EBS volume was resized in AWS Console
            sudo growpart /dev/xvda 1 2>/dev/null || sudo growpart /dev/nvme0n1 1 2>/dev/null || true
            sudo resize2fs /dev/xvda1 2>/dev/null || sudo resize2fs /dev/nvme0n1p1 2>/dev/null || true

            # 2. Free up disk space (clean apt cache, system logs, npm cache, PM2 logs)
            sudo apt-get clean 2>/dev/null || true
            sudo journalctl --vacuum-time=1d 2>/dev/null || true
            npm cache clean --force 2>/dev/null || true
            rm -rf ~/.npm /tmp/* /var/tmp/* 2>/dev/null || true
            pm2 flush || true
            rm -rf ~/.pm2/logs/* 2>/dev/null || true

            # 3. Ensure 1GB swap space exists (prevents OOM kills while conserving 8GB disk)
            if [ ! -f /swapfile ] && [ $(free -m | awk '/^Swap:/{print $2}') -eq 0 ]; then
              sudo fallocate -l 1G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=1024
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
            fi

            # 4. Install dependencies & generate Prisma client
            npm install --no-audit --no-fund
            npx prisma generate || node node_modules/prisma/build/index.js generate

            # 5. Restart PM2 cleanly
            pm2 delete all || true
            pm2 start ecosystem.config.cjs
            pm2 save


