name: Node.js CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Get latest source code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 3. Deploy to AWS EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # Load node/npm/pm2 in a non-interactive SSH session (nvm installs)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd ~/Gym-managment-system
            git pull origin main

            # Install dependencies (full install, Prisma CLI is usually a devDependency)
            npm ci

            # Prisma: regenerate client + apply schema
            npx prisma generate
            if [ -d prisma/migrations ]; then
              npx prisma migrate deploy
            else
              npx prisma db push
            fi

            # Restart the app
            pm2 reload gym-backend --update-env || pm2 start src/server.js --name gym-backend
            pm2 save