name: Node.js CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # Load node/npm/pm2 in a non-interactive SSH session (nvm installs)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # 1. Pull latest code
            cd ~/Gym-managment-system
            git pull origin main

            # 2. Install dependencies
            npm ci

            # 3. Prisma: regenerate client + apply schema
            npx prisma generate
            if [ -d prisma/migrations ]; then
              npx prisma migrate deploy
            else
              npx prisma db push
            fi

            # 4. Restart: remove any old "gym" process(es), start exactly one
            pm2 delete gym || true
            pm2 start npm --name gym -- start
            pm2 save

  
            pm2 list